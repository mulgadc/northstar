services:
  predastore:
    build:
      context: ${PREDASTORE_SRC:-../../predastore}
      dockerfile_inline: |
        FROM golang:1.27.0-alpine AS build
        RUN apk add build-base git
        WORKDIR /src
        COPY . .
        RUN GOFIPS140=v1.0.0 go build -ldflags "-s -w" -o /s3d ./cmd/s3d
        FROM alpine:3.23
        RUN apk add ca-certificates gcompat netcat-openbsd
        COPY --from=build /s3d /s3d
        RUN printf '0123456789abcdef0123456789abcdef' > /encryption.key && chmod 600 /encryption.key
        EXPOSE 9443
        CMD ["/s3d"]
    # s3d takes everything host-local as a flag, so the config file stays the
    # same on every machine and the paths live next to the mounts below.
    command:
      - "/s3d"
      - "-config=/config/predastore.toml"
      - "-host=1"
      - "-data-dir=/data"
      - "-tls-cert=/certs/predastore.pem"
      - "-tls-key=/certs/predastore.key"
      - "-encryption-key=/encryption.key"
    volumes:
      - ./testdata/predastore.toml:/config/predastore.toml:ro
      - ./testdata/certs:/certs:ro
      - predastore-data:/data
    ports:
      - "9443:9443"
    # The gate only listens once the meta replica has elected a leader, so an
    # open port is a real readiness signal rather than a bind.
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9443"]
      interval: 2s
      timeout: 5s
      retries: 30

  northstar:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      ZONE_DIR: "s3://dns-zones"
      AWS_ACCESS_KEY: "AKIAIOSFODNN7EXAMPLE"
      AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
      AWS_REGION: "us-east-1"
      NORTHSTAR_S3_ENDPOINT: "https://predastore:9443"
      SSL_CERT_FILE: "/certs/ca.pem"
      S3_SYNC_RETRY: "3"
      PORT: "5553"
      HOST: "0.0.0.0"
      DOT_PORT: "8853"
      NORTHSTAR_TLS_CERT: "/certs/server.pem"
      NORTHSTAR_TLS_KEY: "/certs/server.key"
    volumes:
      - ./testdata/certs:/certs:ro
    ports:
      - "5553:5553/udp"
      - "5553:5553/tcp"
      - "8853:8853/tcp"
    depends_on:
      predastore:
        condition: service_healthy

volumes:
  predastore-data:
