# Single-host predastore cluster for the northstar E2E.
#
# One s3d process runs the gate, a meta replica and three blob nodes over the
# in-process pipe: no QUIC socket, no loopback aliases and no trust anchor.
# The gate still serves HTTPS, so a TLS keypair is required.

version = 1
region = "us-east-1"

[rs]
data = 2
parity = 1

# data_dir, tls_cert, tls_key and encryption_key are absent by design: they are
# host-local, and docker-compose.yml passes them as flags alongside the mounts
# that supply them.
[[host]]
id = 1
addr = "127.0.0.1"

  # The S3 API is reached from outside the container — by the test harness on
  # the published port, and by northstar over the compose network — so the gate
  # binds the wildcard rather than following the host's loopback address.
  [[host.node]]
  id = 1
  role = "gate"
  port = 9443
  bind_addr = "0.0.0.0"

  [[host.node]]
  id = 2
  role = "meta"
  port = 6660

  [[host.node]]
  id = 3
  role = "blob"
  port = 9991

  [[host.node]]
  id = 4
  role = "blob"
  port = 9992

  [[host.node]]
  id = 5
  role = "blob"
  port = 9993

# The zone bucket is declared here rather than created by the harness: the
# tests upload into it on the first request.
[[bucket]]
name = "dns-zones"
region = "us-east-1"
account_id = "123456789012"
public = false

# A config-defined service account. These are trusted: the policy table is only
# consulted for IAM accounts, so none is written here.
[[auth]]
access_key_id = "AKIAIOSFODNN7EXAMPLE"
secret_access_key = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
account_id = "123456789012"
