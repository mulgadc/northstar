version: 2
updates:
  - package-ecosystem: gomod
    target-branch: dev
    directories:
      - /
      - /e2e
    schedule:
      interval: weekly
      day: sunday
      timezone: Australia/Sydney
    cooldown:
      default-days: 3
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
      day: sunday
      timezone: Australia/Sydney
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
      day: sunday
      timezone: Australia/Sydney
    cooldown:
      default-days: 3
    # The golang and alpine versions are deliberate; only their digests move here.
    ignore:
      - dependency-name: golang
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: alpine
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      docker-images:
        patterns:
          - "*"
